<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HomeFix - Create New Booking</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f4f8;
      color: #111827;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 30px 16px 50px;
    }

    .booking-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 34px 28px 40px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 10px;
    }

    .title {
      text-align: center;
      font-size: 42px;
      font-weight: 800;
      line-height: 1.15;
      margin: 5px 0 18px;
    }

    .subtitle {
      text-align: center;
      font-size: 20px;
      color: #5b6472;
      margin-bottom: 38px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    label::after {
      content: " *";
      color: #dc2626;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 18px;
      background: #ffffff;
      padding: 17px 18px;
      font-size: 18px;
      color: #111827;
      outline: none;
      transition: 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    select:disabled {
      background: #f3f4f6;
      color: #9ca3af;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .optional::after {
      content: "";
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px;
      background: #111827;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #1f2937;
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 25px;
      padding: 15px 17px;
      border-radius: 14px;
      font-size: 16px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .booking-result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #eff6ff;
      border: 1px solid #93c5fd;
      border-radius: 16px;
      color: #1e3a8a;
    }

    .booking-result strong {
      font-size: 20px;
    }

    @media (max-width: 600px) {

      .page {
        padding: 18px 10px 35px;
      }

      .booking-card {
        padding: 28px 20px 32px;
        border-radius: 24px;
      }

      .logo {
        font-size: 32px;
      }

      .title {
        font-size: 36px;
      }

      .subtitle {
        font-size: 18px;
      }

      label {
        font-size: 18px;
      }

      input,
      select,
      textarea {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="booking-card">

      <div class="logo">
        HomeFix
      </div>

      <h1 class="title">
        Create New<br>
        Booking
      </h1>

      <div class="subtitle">
        No login required to create a booking
      </div>

      <!-- MESSAGE -->
      <div id="message" class="message"></div>

      <!-- BOOKING FORM -->
      <form
        id="bookingForm"
        onsubmit="return handleBookingSubmit(event)"
      >

        <!-- CUSTOMER NAME -->
        <div class="form-group">

          <label for="customer_name">
            Customer Name
          </label>

          <input
            type="text"
            id="customer_name"
            name="customer_name"
            placeholder="Enter customer name"
            required
          >

        </div>


        <!-- PHONE -->
        <div class="form-group">

          <label for="phone">
            Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter phone number"
            required
          >

        </div>


        <!-- CATEGORY -->
        <div class="form-group">

          <label for="category">
            Problem Category
          </label>

          <select
            id="category"
            name="category"
            required
          >

            <option value="">
              Select Category
            </option>

            <option value="Electrical">
              Electrical
            </option>

            <option value="Plumbing">
              Plumbing
            </option>

            <option value="AC Service">
              AC Service
            </option>

            <option value="Appliance Repair">
              Appliance Repair
            </option>

            <option value="Painting">
              Painting
            </option>

          </select>

        </div>


        <!-- SUB CATEGORY -->
        <div class="form-group">

          <label for="sub_category">
            Problem Sub-category
          </label>

          <select
            id="sub_category"
            name="sub_category"
            required
            disabled
          >

            <option value="">
              Select Sub-category
            </option>

          </select>

        </div>


        <!-- SERVICE -->
        <div class="form-group">

          <label for="service">
            Service Item
          </label>

          <select
            id="service"
            name="service"
            required
            disabled
          >

            <option value="">
              Select Service
            </option>

          </select>

        </div>


        <!-- PRICE -->
        <div class="form-group">

          <label for="price">
            Service Price (৳)
          </label>

          <input
            type="number"
            id="price"
            name="price"
            placeholder="Enter price manually"
            min="0"
            step="0.01"
            required
          >

        </div>


        <!-- SERVICE DATE -->
        <div class="form-group">

          <label for="service_date">
            Preferred Service Date
          </label>

          <input
            type="date"
            id="service_date"
            name="service_date"
            required
          >

        </div>


        <!-- ADDRESS -->
        <div class="form-group">

          <label for="address">
            Service Address
          </label>

          <textarea
            id="address"
            name="address"
            placeholder="Enter complete service address"
            required
          ></textarea>

        </div>


        <!-- PROBLEM -->
        <div class="form-group">

          <label
            for="problem"
            class="optional"
          >
            Problem / Additional Information
          </label>

          <textarea
            id="problem"
            name="problem"
            placeholder="Describe the problem or additional information"
          ></textarea>
