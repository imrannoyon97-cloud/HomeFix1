<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HomeFix.live - Book a Service</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      min-height: 78px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: #2580ee;
    }

    .logo small {
      color: #667085;
      font-size: 13px;
    }

    .login-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 110px;
      height: 48px;
      padding: 0 20px;
      border: 1px solid #d9dee7;
      border-radius: 15px;
      background: #fff;
      color: #182033;
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
    }

    .page {
      max-width: 900px;
      margin: auto;
      padding: 34px 16px 60px;
    }

    .hero {
      text-align: center;
      margin-bottom: 26px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .hero p {
      margin: 0;
      color: #667085;
    }

    .card {
      background: #fff;
      border: 1px solid #e1e6ee;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 8px 28px rgba(20,35,60,.06);
    }

    .section-title {
      margin: 0 0 24px;
      font-size: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .field {
      margin-bottom: 4px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 16px;
    }

    .required {
      color: #e03131;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #d7dce5;
      border-radius: 14px;
      background: #fff;
      color: #182033;
      font-size: 17px;
      padding: 15px 16px;
      outline: none;
      font-family: inherit;
    }

    input:focus,
    textarea:focus {
      border-color: #2580ee;
      box-shadow: 0 0 0 3px rgba(37,128,238,.12);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .hint {
      margin-top: 7px;
      color: #667085;
      font-size: 13px;
    }

    .submit-btn {
      width: 100%;
      border: 0;
      border-radius: 15px;
      background: #2580ee;
      color: white;
      font-size: 18px;
      font-weight: 800;
      padding: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: .65;
    }

    #bookingMessage {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 700;
      line-height: 1.45;
      word-break: break-word;
    }

    #bookingMessage.success {
      display: block;
      background: #eaf8ef;
      color: #16733a;
      border: 1px solid #bce8ca;
    }

    #bookingMessage.error {
      display: block;
      background: #fff0f0;
      color: #c62828;
      border: 1px solid #f1bcbc;
    }

    #bookingMessage.info {
      display: block;
      background: #eef6ff;
      color: #175da8;
      border: 1px solid #c7e0ff;
    }

    .footer {
      text-align: center;
      color: #7a8495;
      padding: 24px 16px;
      font-size: 14px;
    }

    @media (max-width: 700px) {

      .header-inner {
        padding: 12px 14px;
      }

      .logo {
        font-size: 25px;
      }

      .login-btn {
        min-width: 92px;
        height: 44px;
        font-size: 15px;
      }

      .page {
        padding: 24px 10px 45px;
      }

      .hero h1 {
        font-size: 28px;
      }

      .card {
        padding: 20px 16px;
        border-radius: 20px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <div class="logo">
      HOME<span>FIX</span><small>.LIVE</small>
    </div>

    <a class="login-btn" href="login.html">
      Login
    </a>

  </div>

</header>


<main class="page">

  <section class="hero">

    <h1>Book a Home Service</h1>

    <p>
      Tell us what service you need.
      No login is required to create a booking.
    </p>

  </section>


  <section class="card">

    <h2 class="section-title">
      Create New Booking
    </h2>


    <form id="bookingForm" novalidate>

      <div class="grid">


        <!-- CUSTOMER NAME -->

        <div class="field">

          <label for="customerName">
            Customer Name
            <span class="required">*</span>
          </label>

          <input
            id="customerName"
            name="customerName"
            type="text"
            placeholder="Enter customer name"
            autocomplete="name"
            required
          >

        </div>


        <!-- PHONE -->

        <div class="field">

          <label for="customerPhone">
            Phone Number
            <span class="required">*</span>
          </label>

          <input
            id="customerPhone"
            name="customerPhone"
            type="tel"
            placeholder="01XXXXXXXXX"
            autocomplete="tel"
            required
          >

        </div>


        <!-- CATEGORY -->

        <div class="field">

          <label for="category">
            Problem Category
            <span class="required">*</span>
          </label>

          <input
            id="category"
            name="category"
            type="text"
            list="categoryList"
            placeholder="e.g. Electrical"
            required
          >

          <datalist id="categoryList">

            <option value="Electrical">
            <option value="Plumbing">
            <option value="AC Service">
            <option value="Appliance Repair">
            <option value="Painting">
            <option value="Other">

          </datalist>

        </div>


        <!-- SUB CATEGORY -->

        <div class="field">

          <label for="subCategory">
            Problem Sub-category
            <span class="required">*</span>
          </label>

          <input
            id="subCategory"
            name="subCategory"
            type="text"
            placeholder="Enter sub-category"
            required
          >

        </div>


        <!-- SERVICE -->

        <div class="field full">

          <label for="service">
            Service Item
            <span class="required">*</span>
          </label>

          <input
            id="service"
            name="service"
            type="text"
            placeholder="Enter service item"
            required
          >

        </div>


        <!-- PRICE -->

        <div class="field">

          <label for="price">
            Service Price (৳)
            <span class="required">*</span>
          </label>

          <input
            id="price"
            name="price"
            type="number"
            min="0"
            step="0.01"
            placeholder="Enter price manually"
            required
          >

          <div class="hint">
            Price must be entered manually.
          </div>

        </div>


        <!-- SERVICE DATE -->

        <div class="field">

          <label for="serviceDate">
            Preferred Service Date
            <span class="required">*</span>
          </label>

          <input
            id="serviceDate"
            name="serviceDate"
            type="date"
            required
          >

        </div>


        <!-- ADDRESS -->

        <div class="field full">

          <label for="address">
            Service Address
            <span class="required">*</span>
          </label>

          <textarea
            id="address"
            name="address"
            placeholder="Enter complete service address"
            required
          ></textarea>

        </div>


        <!-- PROBLEM -->

        <div class="field full">

          <label for="problem">
            Problem / Additional Information
          </label>

          <textarea
            id="problem"
            name="problem"
            placeholder="Describe the problem or additional requirements"
          ></textarea>

        </div>


        <!-- SUBMIT -->

        <div class="field full">

          <button
            id="submitBooking"
            class="submit-btn"
            type="submit"
          >
            Submit Booking
          </button>

          <div
            id="bookingMessage"
            role="alert"
          ></div>

        </div>


      </div>

    </form>

  </section>

</main>


<footer class="footer">
  © 2026 HomeFix.live. All rights reserved.
</footer>


<!-- IMPORTANT: Supabase MUST load first -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- HomeFix booking JavaScript -->
<script src="public-booking.js"></script>

</body>
</html>
