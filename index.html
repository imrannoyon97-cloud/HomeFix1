<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HomeFix.live - Booking</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.header{
  background:white;
  border-bottom:1px solid #ddd;
}

.header-inner{
  max-width:900px;
  margin:auto;
  padding:15px 20px;
  min-height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:30px;
  font-weight:800;
}

.logo span{
  color:#2580ee;
}

.logo small{
  color:#667085;
  font-size:13px;
}

.login-btn{
  padding:13px 25px;
  border:1px solid #ddd;
  border-radius:14px;
  text-decoration:none;
  color:#172033;
  font-weight:bold;
}

.container{
  max-width:850px;
  margin:auto;
  padding:30px 15px;
}

.card{
  background:white;
  padding:28px;
  border-radius:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}

h1{
  text-align:center;
  margin-top:0;
}

.subtitle{
  text-align:center;
  color:#667085;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

.required{
  color:red;
}

input,
select,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #d6dbe3;
  border-radius:12px;
  font-size:16px;
  background:white;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.hint{
  color:#777;
  font-size:13px;
  margin-top:5px;
}

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:13px;
  background:#2580ee;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

#bookingMessage{
  display:none;
  margin-top:15px;
  padding:14px;
  border-radius:10px;
  font-weight:bold;
}

.success{
  display:block !important;
  background:#e9f8ee;
  color:#16733a;
}

.error{
  display:block !important;
  background:#fff0f0;
  color:#c62828;
}

.info{
  display:block !important;
  background:#eef6ff;
  color:#175da8;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .card{
    padding:20px 15px;
  }

  .logo{
    font-size:24px;
  }

}

</style>
</head>


<body>

<header class="header">

<div class="header-inner">

<div class="logo">
HOME<span>FIX</span><small>.LIVE</small>
</div>

<a href="login.html" class="login-btn">
Login
</a>

</div>

</header>


<div class="container">

<div class="card">

<h1>Create New Booking</h1>

<div class="subtitle">
No login required to create a booking
</div>


<!-- IMPORTANT: onsubmit prevents page reload -->
<form
  id="bookingForm"
  onsubmit="return handleBookingSubmit(event)"
>


<div class="grid">


<!-- CUSTOMER NAME -->

<div>

<label>
Customer Name <span class="required">*</span>
</label>

<input
  id="customerName"
  type="text"
  placeholder="Enter customer name"
  required
>

</div>


<!-- PHONE -->

<div>

<label>
Phone Number <span class="required">*</span>
</label>

<input
  id="customerPhone"
  type="tel"
  placeholder="01XXXXXXXXX"
  required
>

</div>


<!-- CATEGORY -->

<div>

<label>
Problem Category <span class="required">*</span>
</label>

<select
  id="category"
  required
>

<option value="">
Select Category
</option>

</select>

</div>


<!-- SUB CATEGORY -->

<div>

<label>
Problem Sub-category <span class="required">*</span>
</label>

<select
  id="subCategory"
  required
  disabled
>

<option value="">
Select Sub-category
</option>

</select>

</div>


<!-- SERVICE -->

<div class="full">

<label>
Service Item <span class="required">*</span>
</label>

<select
  id="service"
  required
  disabled
>

<option value="">
Select Service
</option>

</select>

</div>


<!-- PRICE -->

<div>

<label>
Service Price (৳)
<span class="required">*</span>
</label>

<input
  id="price"
  type="number"
  min="0"
  step="0.01"
  placeholder="Enter price manually"
  required
>

<div class="hint">
Price must be entered manually.
</div>

</div>


<!-- DATE -->

<div>

<label>
Preferred Service Date
<span class="required">*</span>
</label>

<input
  id="serviceDate"
  type="date"
  required
>

</div>


<!-- ADDRESS -->

<div class="full">

<label>
Service Address
<span class="required">*</span>
</label>

<textarea
  id="address"
  placeholder="Enter complete service address"
  required
></textarea>

</div>


<!-- PROBLEM -->

<div class="full">

<label>
Problem / Additional Information
</label>

<textarea
  id="problem"
  placeholder="Describe the problem"
></textarea>

</div>


<!-- BUTTON -->

<div class="full">

<button
  id="submitBooking"
  type="submit"
>
Submit Booking
</button>

<div id="bookingMessage"></div>

</div>


</div>

</form>

</div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- HomeFix JS -->
<script src="./public-booking.js?v=3"></script>


<!-- Safety fallback: prevents normal browser form reload -->
<script>

function handleBookingSubmit(event){

  event.preventDefault();

  if(typeof window.submitHomeFixBooking === "function"){

    window.submitHomeFixBooking(event);

  }

  return false;
}

</script>

</body>
</html>
