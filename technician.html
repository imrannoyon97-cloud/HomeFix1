<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HomeFix Technician</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#162033}
.wrap{max-width:700px;margin:auto;padding:18px}.card,.top{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #0001}
input,select{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:10px;margin:6px 0 10px;font-size:15px}
button{border:0;border-radius:11px;padding:12px 16px;font-weight:700}.primary{background:#2878df;color:#fff}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eaf2ff;color:#2878df;font-size:12px;font-weight:700}
.muted{color:#667085;font-size:13px}.job{border:1px solid #e1e6ee;border-radius:14px;padding:14px;margin-top:10px}.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h2 style="margin:0">⚡ HomeFix Technician</h2><div class="muted">Assigned Bookings</div></div>

<div id="loginBox" class="card">
<h2>Technician Login</h2>
<input id="phone" placeholder="Phone">
<input id="pin" placeholder="PIN" type="password">
<button class="primary" onclick="login()">Login</button>
</div>

<div id="app" class="hidden">
<div class="card"><h2 id="welcome"></h2><button onclick="logout()">Logout</button></div>
<div id="jobs"></div>
</div>
</div>

<script>
const TK='homefixTechniciansV1',BK='homefixBookingsV2';
const get=k=>JSON.parse(localStorage.getItem(k)||'[]');
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null;

function login(){
 const t=get(TK).find(x=>x.phone===phone.value.trim()&&x.pin===pin.value.trim()&&x.active);
 if(!t){alert('Invalid technician login');return}
 sessionStorage.setItem('hfTechId',t.id);show();
}
function show(){
 me=get(TK).find(x=>x.id===sessionStorage.getItem('hfTechId'));
 if(!me){loginBox.classList.remove('hidden');app.classList.add('hidden');return}
 loginBox.classList.add('hidden');app.classList.remove('hidden');welcome.textContent='Hello, '+me.name;render();
}
function logout(){sessionStorage.removeItem('hfTechId');me=null;show()}
function updateStatus(id,status){
 const a=get(BK),j=a.find(x=>x.id===id);
 if(j){j.status=status;save(BK,a);render()}
}
function render(){
 const a=get(BK).filter(x=>x.technicianId===me.id);
 jobs.innerHTML=a.length?a.map(j=>`<div class="job">
 <b>${esc(j.id)}</b> <span class="badge">${esc(j.status)}</span>
 <h3>${esc(j.service?.name||'Service')}</h3>
 <div>${esc(j.customer?.name||'')} • ${esc(j.customer?.phone||'')}</div>
 <div class="muted">${esc(j.customer?.address||'')}</div>
 <label>Status</label>
 <select onchange="updateStatus('${esc(j.id)}',this.value)">
 <option ${j.status==='Assigned'?'selected':''}>Assigned</option>
 <option ${j.status==='On the way'?'selected':''}>On the way</option>
 <option ${j.status==='Working'?'selected':''}>Working</option>
 <option ${j.status==='Completed'?'selected':''}>Completed</option>
 </select>
 </div>`).join(''):'<div class="card"><p class="muted">No assigned bookings.</p></div>';
}
show();
</script>
</body>
</html>
